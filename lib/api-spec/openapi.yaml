openapi: 3.0.3
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session operations
  - name: staff-payments
    description: Admin-only kiosk payment operations for staff
  - name: staff-orders
    description: Admin-only active kiosk order workflow
  - name: staff-push
    description: Admin device push notification preferences
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Create an authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Access and refresh tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: Rotated access and refresh tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshSessionResponse"
  /v1/auth/me:
    get:
      operationId: getCurrentSession
      tags: [auth]
      summary: Get the authenticated session user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Authenticated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSessionResponse"
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke one refresh-token session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Session revoked
  /v1/auth/logout-all:
    post:
      operationId: logoutAllSessions
      tags: [auth]
      summary: Revoke all sessions for the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: All sessions revoked
  /v1/payments/mobile/dashboard:
    get:
      operationId: getStaffPaymentDashboard
      tags: [staff-payments]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Kiosk payment dashboard totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffPaymentDashboardResponse"
  /v1/payments/mobile:
    get:
      operationId: listStaffPayments
      tags: [staff-payments]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { type: string, enum: [pending, captured, failed, canceled, refunded, partially_refunded] } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Paginated kiosk payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffPaymentListResponse"
  /v1/payments/mobile/{paymentId}:
    get:
      operationId: getStaffPayment
      tags: [staff-payments]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Kiosk payment details with live Square status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffPaymentResponse"
  /v1/payments/mobile/{paymentId}/cancel:
    post:
      operationId: cancelStaffPayment
      tags: [staff-payments]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Confirmed canceled Terminal checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffPaymentResponse"
  /v1/payments/mobile/{paymentId}/refunds:
    post:
      operationId: createStaffPaymentRefund
      tags: [staff-payments]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffRefundRequest"
      responses:
        "200":
          description: Idempotently created refund; status is Square's confirmed status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffRefundResponse"
  /v1/orders/mobile/dashboard:
    get:
      operationId: getStaffOrderDashboard
      tags: [staff-orders]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active paid kiosk order counts by fulfillment state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffOrderDashboardResponse" }
  /v1/orders/mobile:
    get:
      operationId: listStaffOrders
      tags: [staff-orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/StaffOrderStatus" } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Active paid kiosk orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffOrderListResponse" }
  /v1/orders/mobile/{orderId}:
    get:
      operationId: getStaffOrder
      tags: [staff-orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Paid kiosk order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffOrderResponse" }
  /v1/orders/mobile/{orderId}/start:
    post:
      operationId: startStaffOrder
      tags: [staff-orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order started, or its existing processing state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffOrderResponse" }
  /v1/orders/mobile/{orderId}/ready:
    post:
      operationId: markStaffOrderReady
      tags: [staff-orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order marked ready, or its existing ready state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffOrderResponse" }
  /v1/orders/mobile/{orderId}/picked-up:
    post:
      operationId: markStaffOrderPickedUp
      tags: [staff-orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order marked delivered, or its existing delivered state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffOrderResponse" }
  /v1/orders/mobile/push-tokens:
    put:
      operationId: registerStaffPushToken
      tags: [staff-push]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffPushTokenRequest" }
      responses:
        "200":
          description: Idempotently registered or updated device token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffPushTokenResponse" }
  /v1/orders/mobile/push-tokens/{tokenId}:
    patch:
      operationId: updateStaffPushToken
      tags: [staff-push]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TokenId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffPushTokenUpdateRequest" }
      responses:
        "200":
          description: Updated device notification preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffPushTokenResponse" }
    delete:
      operationId: deleteStaffPushToken
      tags: [staff-push]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TokenId"
      responses:
        "204":
          description: Device token deleted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    LoginRequest:
      type: object
      required: [emailAddress, password]
      properties:
        emailAddress: { type: string, format: email }
        password: { type: string, minLength: 1 }
    RefreshSessionRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1 }
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1 }
    AuthTokens:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
    LoginData:
      allOf:
        - $ref: "#/components/schemas/AuthTokens"
        - type: object
          required: [userId]
          properties:
            userId: { type: string, format: uuid }
    CurrentSessionUser:
      type: object
      required: [id, firstName, lastName, emailAddress, phoneNumber, avatarUrl, role]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        emailAddress: { type: string, format: email }
        phoneNumber: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true, format: uri }
        role:
          type: string
          enum: [user, admin]
          description: Lowercase role returned by the API.
    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/LoginData" }
    RefreshSessionResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/AuthTokens" }
    CurrentSessionResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/CurrentSessionUser" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Money:
      type: object
      required: [amountCents, currency]
      properties:
        amountCents: { type: integer }
        currency: { type: string }
    StaffOrderStatus:
      type: string
      enum: [new, processing, ready, picked_up]
    StaffOrderLine:
      type: object
      required: [id, productName, sku, quantity, unitPrice, lineTotal, selectedSides, options]
      properties:
        id: { type: string, format: uuid }
        productName: { type: string }
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { $ref: "#/components/schemas/Money" }
        lineTotal: { $ref: "#/components/schemas/Money" }
        selectedSides: { type: string, nullable: true }
        options:
          type: array
          items: { type: string }
    StaffOrderHistory:
      type: object
      required: [id, status, displayStatus, changedAt, changedBy]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        displayStatus: { $ref: "#/components/schemas/StaffOrderStatus" }
        changedAt: { type: string, format: date-time }
        changedBy: { type: string, nullable: true }
    StaffOrder:
      type: object
      required: [id, orderNumber, customerName, customerPhone, customerEmail, status, databaseStatus, orderDate, specialInstructions, total, items, payment, history]
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string, nullable: true }
        customerName: { type: string, nullable: true }
        customerPhone: { type: string, nullable: true }
        customerEmail: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/StaffOrderStatus" }
        databaseStatus: { type: string }
        orderDate: { type: string, format: date-time }
        specialInstructions: { type: string, nullable: true }
        total: { $ref: "#/components/schemas/Money" }
        items:
          type: array
          items: { $ref: "#/components/schemas/StaffOrderLine" }
        payment:
          type: object
          required: [id, provider, status, amount, capturedAt]
          properties:
            id: { type: string, format: uuid }
            provider: { type: string }
            status: { type: string, enum: [captured, partially_refunded] }
            amount: { $ref: "#/components/schemas/Money" }
            capturedAt: { type: string, format: date-time, nullable: true }
        history:
          type: array
          items: { $ref: "#/components/schemas/StaffOrderHistory" }
    StaffOrderDashboard:
      type: object
      required: [newCount, processingCount, readyCount, activeCount]
      properties:
        newCount: { type: integer }
        processingCount: { type: integer }
        readyCount: { type: integer }
        activeCount: { type: integer }
    StaffPushTokenRequest:
      type: object
      required: [token, rolePreference]
      properties:
        token: { type: string, minLength: 10, maxLength: 512 }
        rolePreference: { type: string, enum: [kitchen, cashier, both] }
        enabled: { type: boolean, default: true }
    StaffPushTokenUpdateRequest:
      type: object
      minProperties: 1
      properties:
        rolePreference: { type: string, enum: [kitchen, cashier, both] }
        enabled: { type: boolean }
    StaffPushToken:
      type: object
      required: [id, token, rolePreference, enabled, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        token: { type: string }
        rolePreference: { type: string, enum: [kitchen, cashier, both] }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StaffOrderResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/StaffOrder" }
    StaffOrderDashboardResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/StaffOrderDashboard" }
    StaffOrderListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/StaffOrder" }
            meta: { $ref: "#/components/schemas/PaginationMeta" }
    StaffPushTokenResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/StaffPushToken" }
    StaffRefund:
      type: object
      required: [id, paymentId, actorAdminId, provider, providerRefundId, providerStatus, reason, amount, requestId, restoreInventory, inventoryRestored, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        actorAdminId: { type: string, format: uuid }
        provider: { type: string, enum: [square] }
        providerRefundId: { type: string, nullable: true }
        providerStatus: { type: string, enum: [PENDING, COMPLETED, REJECTED, FAILED] }
        reason: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        requestId: { type: string, format: uuid }
        restoreInventory:
          type: boolean
          description: When true, the complete order inventory is restored once across all refunds or cancellation; partial per-line restoration is not supported.
        inventoryRestored:
          type: boolean
          description: True when this refund was the durable trigger for the order's one-time complete inventory restoration.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StaffPayment:
      type: object
      required: [id, orderId, orderNumber, orderStatus, provider, localStatus, liveProviderStatus, amount, refundedAmount, refundableAmount, receiptUrl, customerName, customerPhone, items, createdAt, capturedAt, canCancel, canRefund, refunds]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderNumber: { type: string, nullable: true }
        orderStatus: { type: string, description: Current local kiosk order status. }
        provider: { type: string }
        localStatus: { type: string }
        liveProviderStatus: { type: string, nullable: true }
        amount: { $ref: "#/components/schemas/Money" }
        refundedAmount: { $ref: "#/components/schemas/Money" }
        refundableAmount: { $ref: "#/components/schemas/Money" }
        receiptUrl: { type: string, nullable: true, format: uri }
        customerName: { type: string, nullable: true }
        customerPhone: { type: string, nullable: true }
        items:
          type: array
          description: Snapshot of kiosk order items and selected options.
          items:
            $ref: "#/components/schemas/StaffPaymentLineItem"
        createdAt: { type: string, format: date-time }
        capturedAt: { type: string, nullable: true, format: date-time }
        canCancel: { type: boolean }
        canRefund: { type: boolean }
        refunds:
          type: array
          items: { $ref: "#/components/schemas/StaffRefund" }
    StaffPaymentLineItem:
      type: object
      required: [productName, quantity, selectedSides, options]
      properties:
        productName: { type: string }
        quantity: { type: integer, minimum: 1 }
        selectedSides: { type: string, nullable: true }
        options:
          type: array
          items: { type: string }
    StaffPaymentDashboard:
      type: object
      required: [pendingCount, capturedCount, failedCount, refundedCount, capturedTotal, refundedTotal]
      properties:
        pendingCount: { type: integer }
        capturedCount: { type: integer }
        failedCount: { type: integer }
        refundedCount: { type: integer }
        capturedTotal: { $ref: "#/components/schemas/Money" }
        refundedTotal: { $ref: "#/components/schemas/Money" }
    CreateStaffRefundRequest:
      type: object
      required: [requestId, reason, amountCents, restoreInventory]
      properties:
        requestId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 192 }
        amountCents: { type: integer, minimum: 1 }
        restoreInventory:
          type: boolean
          description: Restore the complete order inventory once if Square confirms this refund. This endpoint does not support per-line inventory restoration.
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean, enum: [true] }
    StaffPaymentResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/StaffPayment" }
    StaffRefundResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/StaffRefund" }
    StaffPaymentDashboardResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/StaffPaymentDashboard" }
    PaginationMeta:
      type: object
      required: [total, page, limit, totalPages]
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        totalPages: { type: integer }
    StaffPaymentListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/StaffPayment" }
            meta: { $ref: "#/components/schemas/PaginationMeta" }

