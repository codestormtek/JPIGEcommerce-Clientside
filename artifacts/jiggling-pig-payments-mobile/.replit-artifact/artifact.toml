kind = "mobile"
previewPath = "/payments-mobile/"
title = "Jiggling Pig Payments"
description = "A staff-only mobile app for monitoring kiosk payments, canceling pending Terminal checkouts, and issuing controlled Square refunds."
version = "1.0.0"
id = "artifacts/jiggling-pig-payments-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/payments-mobile/" ]
localPort = 26258

[services.development]
run = "pnpm --filter @workspace/jiggling-pig-payments-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jiggling-pig-payments-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/jiggling-pig-payments-mobile", "run", "serve" ]

[services.env]
PORT = "26258"
BASE_PATH = "/payments-mobile/"
