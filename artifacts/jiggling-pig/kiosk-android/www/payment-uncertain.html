<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Check payment status</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; padding: 32px; background: #17100c; color: #fff8eb; font-family: system-ui, sans-serif; text-align: center; }
      main { max-width: 660px; }
      h1 { margin: 0 0 12px; font-size: 38px; }
      p { margin: 0; color: #e8d6c3; font-size: 22px; line-height: 1.5; }
    </style>

  <body>
    <main>
      <h1>Ask a staff member for help</h1>
      <p>The connection failed while a payment result may still be pending. Do not retry or take another payment until staff verify the order and reader status.</p>
