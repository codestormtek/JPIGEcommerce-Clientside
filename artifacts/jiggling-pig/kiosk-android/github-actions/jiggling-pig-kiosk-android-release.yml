name: Release signed Jiggling Pig kiosk APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without a v prefix (for example, 1.2.3)
        required: true
        type: string
      version_code:
        description: Positive, monotonically increasing Android version code
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: kiosk-production-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: artifacts/jiggling-pig/kiosk-android

jobs:
  release-apk:
    name: Signed Android release APK
    if: github.ref == 'refs/heads/main'
    environment: kiosk-production-signing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIOSK_VERSION_NAME: ${{ inputs.version }}
      KIOSK_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/jiggling-pig-kiosk-release.jks
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: "10.26.1"
          run_install: false

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4

      - name: Validate release inputs and secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$KIOSK_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] ||
            { echo "::error::version must be a semantic version such as 1.2.3"; exit 1; }
          [[ "$KIOSK_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] &&
            (( KIOSK_VERSION_CODE <= 2100000000 )) ||
            { echo "::error::version_code must be an integer from 1 through 2100000000"; exit 1; }
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is required}"

      - name: Require a new version code and release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="kiosk-v${KIOSK_VERSION_NAME}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $release_tag already exists. Choose a new version."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" >/dev/null 2>&1; then
            echo "::error::Git tag $release_tag already exists. Choose a new version."
            exit 1
          fi
          tags_file="$(mktemp)"
          metadata_dir=""
          cleanup_history() {
            rm -f "$tags_file"
            [ -z "$metadata_dir" ] || rm -rf "$metadata_dir"
          }
          trap cleanup_history EXIT
          if ! gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name | test("^kiosk-v")) | .tag_name' > "$tags_file"; then
            echo "::error::Could not retrieve the complete kiosk release history."
            exit 1
          fi
          max_version_code=0
          while IFS= read -r existing_tag; do
            [ -n "$existing_tag" ] || continue
            metadata_dir="$(mktemp -d)"
            if ! gh release download "$existing_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern 'jiggling-pig-kiosk-release-metadata.json' --dir "$metadata_dir" --clobber; then
              echo "::error::Existing kiosk release $existing_tag is missing required release metadata."
              exit 1
            fi
            metadata_file="$metadata_dir/jiggling-pig-kiosk-release-metadata.json"
            existing_version_code="$(jq -er '.versionCode | select(type == "number" and floor == .)' "$metadata_file")" ||
              { echo "::error::Existing kiosk release $existing_tag has invalid release metadata."; exit 1; }
            (( existing_version_code >= 1 && existing_version_code <= 2100000000 )) ||
              { echo "::error::Existing kiosk release $existing_tag has out-of-range versionCode metadata."; exit 1; }
            (( existing_version_code > max_version_code )) && max_version_code="$existing_version_code"
            rm -rf "$metadata_dir"
            metadata_dir=""
          done < "$tags_file"
          (( KIOSK_VERSION_CODE > max_version_code )) ||
            { echo "::error::version_code must be greater than the prior kiosk release maximum ($max_version_code)."; exit 1; }

      - name: Install standalone dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Check TypeScript and native contract
        run: pnpm run typecheck && pnpm run check:native

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm run build:release-apk

      - name: Delete release keystore
        if: always()
        shell: bash
        run: rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Verify, rename, and checksum APK
        id: package
        shell: bash
        env:
          KIOSK_SIGNING_CERT_SHA256: ${{ vars.KIOSK_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          source_apk="android/app/build/outputs/apk/release/app-release.apk"
          release_dir="$RUNNER_TEMP/kiosk-release"
          release_name="jiggling-pig-kiosk-${KIOSK_VERSION_NAME}.apk"
          mkdir -p "$release_dir"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          [[ -n "$apksigner_path" ]] || { echo "::error::apksigner was not found"; exit 1; }
          "$apksigner_path" verify --verbose --print-certs "$source_apk"
          expected_fingerprint="$(printf '%s' "$KIOSK_SIGNING_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          signer_fingerprint="$("$apksigner_path" verify --verbose --print-certs "$source_apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          [[ "$expected_fingerprint" =~ ^[0-9A-F]{64}$ ]] ||
            { echo "::error::KIOSK_SIGNING_CERT_SHA256 must contain a SHA-256 certificate fingerprint."; exit 1; }
          [[ "$signer_fingerprint" == "$expected_fingerprint" ]] ||
            { echo "::error::APK signer certificate does not match KIOSK_SIGNING_CERT_SHA256."; exit 1; }
          cp "$source_apk" "$release_dir/$release_name"
          (
            cd "$release_dir"
            sha256sum "$release_name" > "$release_name.sha256"
          )
          jq -n \
            --arg versionName "$KIOSK_VERSION_NAME" \
            --argjson versionCode "$KIOSK_VERSION_CODE" \
            --arg gitSha "$GITHUB_SHA" \
            --arg signerFingerprint "$signer_fingerprint" \
            '{versionName: $versionName, versionCode: $versionCode, gitSha: $gitSha, signerFingerprint: $signerFingerprint}' \
            > "$release_dir/jiggling-pig-kiosk-release-metadata.json"
          echo "apk=$release_dir/$release_name" >> "$GITHUB_OUTPUT"
          echo "checksum=$release_dir/$release_name.sha256" >> "$GITHUB_OUTPUT"
          echo "metadata=$release_dir/jiggling-pig-kiosk-release-metadata.json" >> "$GITHUB_OUTPUT"

      - name: Create latest GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="kiosk-v${KIOSK_VERSION_NAME}"
          # Recheck at publication time so a concurrent release cannot receive this APK.
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $release_tag already exists. Refusing to publish assets."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" >/dev/null 2>&1; then
            echo "::error::Git tag $release_tag already exists. Refusing to publish assets."
            exit 1
          fi
          tags_file="$(mktemp)"
          metadata_dir=""
          cleanup_history() {
            rm -f "$tags_file"
            [ -z "$metadata_dir" ] || rm -rf "$metadata_dir"
          }
          trap cleanup_history EXIT
          if ! gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name | test("^kiosk-v")) | .tag_name' > "$tags_file"; then
            echo "::error::Could not retrieve the complete kiosk release history."
            exit 1
          fi
          max_version_code=0
          while IFS= read -r existing_tag; do
            [ -n "$existing_tag" ] || continue
            metadata_dir="$(mktemp -d)"
            if ! gh release download "$existing_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern 'jiggling-pig-kiosk-release-metadata.json' --dir "$metadata_dir" --clobber; then
              echo "::error::Existing kiosk release $existing_tag is missing required release metadata."
              exit 1
            fi
            metadata_file="$metadata_dir/jiggling-pig-kiosk-release-metadata.json"
            existing_version_code="$(jq -er '.versionCode | select(type == "number" and floor == .)' "$metadata_file")" ||
              { echo "::error::Existing kiosk release $existing_tag has invalid release metadata."; exit 1; }
            (( existing_version_code >= 1 && existing_version_code <= 2100000000 )) ||
              { echo "::error::Existing kiosk release $existing_tag has out-of-range versionCode metadata."; exit 1; }
            (( existing_version_code > max_version_code )) && max_version_code="$existing_version_code"
            rm -rf "$metadata_dir"
            metadata_dir=""
          done < "$tags_file"
          (( KIOSK_VERSION_CODE > max_version_code )) ||
            { echo "::error::version_code must be greater than the prior kiosk release maximum ($max_version_code)."; exit 1; }
          gh release create "$release_tag" \
            "${{ steps.package.outputs.apk }}" \
            "${{ steps.package.outputs.checksum }}" \
            "${{ steps.package.outputs.metadata }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Jiggling Pig kiosk v${KIOSK_VERSION_NAME}" \
            --generate-notes \
            --latest
          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest" >> "$GITHUB_STEP_SUMMARY"
